<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paper · Abdulkabir Agboola</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#17150F" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="css/apparatus.css" />
<style>
  .pp { display: grid; grid-template-columns: 1fr; gap: 0; padding: clamp(92px,14vh,140px) 0 40px; }
  .pp__toc { display: none; }
  .pp__main { max-width: 728px; margin: 0 auto; width: 100%; }
  @media (min-width: 1080px) {
    .pp { grid-template-columns: 210px minmax(0,728px); gap: 56px; justify-content: center; }
    .pp__toc { display: block; position: sticky; top: 112px; align-self: start; max-height: calc(100vh - 150px); overflow: auto; }
    .pp__main { margin: 0; }
  }
  .pp__toc-h { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-size: 10px; margin-bottom: 12px; }
  .pp__toc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
  .pp__toc a { display: block; padding: 5px 0 5px 14px; margin-left: -1px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); text-decoration: none; border-left: 2px solid transparent; line-height: 1.45; }
  .pp__toc a:hover { color: var(--ink); }
  .pp__toc a.on { color: var(--blue); border-left-color: var(--blue); }

  .po__back { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-decoration: none; }
  .po__back:hover { color: var(--blue); }
  .pp__date { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin: 26px 0 10px; letter-spacing: .04em; }
  .pp__title { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px,5vw,50px); line-height: 1.05; letter-spacing: -.02em; color: var(--ink); margin: 0 0 14px; }
  .pp__lead { font-family: var(--font-body); font-size: clamp(16px,2.2vw,19px); line-height: 1.6; color: var(--ink-2); margin: 0; }
  .pp__lead:empty { display: none; }
  .pp__rule { height: 1px; background: var(--line); margin: 30px 0 8px; }

  .prose { font-family: var(--font-body); color: var(--ink); font-size: 17px; line-height: 1.74; }
  .prose h1, .prose h2, .prose h3, .prose h4 { font-family: var(--font-display); color: var(--ink); letter-spacing: -.01em; line-height: 1.2; margin: 2.2em 0 .6em; scroll-margin-top: 100px; }
  .prose h2 { font-size: 1.46em; padding-top: .2em; }
  .prose h3 { font-size: 1.16em; }
  .prose h4 { font-size: 1em; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-family: var(--font-mono); }
  .prose p { margin: 0 0 1.15em; }
  .prose a { color: var(--blue); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--blue) 35%, transparent); }
  .prose a:hover { border-bottom-color: var(--blue); }
  .prose strong { font-weight: 600; }
  .prose em { font-style: italic; }
  .prose ul, .prose ol { margin: 0 0 1.2em; padding-left: 1.3em; }
  .prose li { margin: .35em 0; }
  .prose blockquote { margin: 1.4em 0; padding: .2em 0 .2em 1.1em; border-left: 2px solid var(--line-2); color: var(--ink-2); font-style: italic; }
  .prose code { font-family: var(--font-mono); font-size: .86em; background: var(--paper-2); padding: .12em .4em; border-radius: 4px; }
  .prose pre { background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; overflow-x: auto; margin: 0 0 1.3em; }
  .prose pre code { background: none; padding: 0; font-size: .82em; line-height: 1.55; }
  .prose hr { border: 0; height: 1px; background: var(--line); margin: 2.4em 0; }
  .prose table { width: 100%; border-collapse: collapse; margin: 1.2em 0 1.6em; font-size: .9em; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 9px 11px; text-align: left; vertical-align: top; }
  .prose th { font-family: var(--font-mono); font-size: .82em; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-2); background: var(--paper-2); }

  /* math */
  .prose .katex { font-size: 1.04em; }
  .mathblock { margin: 1.5em 0; overflow-x: auto; overflow-y: hidden; }
  .mathblock .katex-display { margin: 0; }

  /* interactive figures */
  .ap-fig { margin: 2.2em 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .fig__stage { position: relative; width: 100%; height: clamp(280px, 44vw, 384px); }
  .fig__stage canvas { display: block; width: 100%; height: 100%; }
  .fig__ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 14px 16px; border-top: 1px solid var(--line); background: var(--paper); }
  .fig__ctl { display: flex; flex-direction: column; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); min-width: 168px; flex: 1 1 168px; max-width: 280px; }
  .fig__ctl-l { display: flex; justify-content: space-between; gap: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .fig__ctl-v { color: var(--blue); }
  .fig__ctl input[type=range] { width: 100%; accent-color: var(--blue); height: 4px; cursor: pointer; }
  .fig__btn, .fig__seg-b { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-2); border-radius: 7px; padding: 8px 13px; cursor: pointer; transition: color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease); }
  .fig__btn:hover, .fig__seg-b:hover { border-color: var(--blue); color: var(--blue); }
  .fig__btn.on { color: var(--blue); border-color: var(--blue); }
  .fig__seg { display: flex; flex-direction: column; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
  .fig__seg > .fig__ctl-l { text-transform: uppercase; letter-spacing: .05em; }
  .fig__seg-grp { display: flex; }
  .fig__seg-b { border-radius: 0; border-left-width: 0; }
  .fig__seg-b:first-child { border-left-width: 1px; border-radius: 7px 0 0 7px; }
  .fig__seg-b:last-child { border-radius: 0 7px 7px 0; }
  .fig__seg-b.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .fig__out { display: flex; flex-direction: column; gap: 4px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
  .fig__out-l { text-transform: uppercase; letter-spacing: .05em; }
  .fig__out-v { font-size: 15px; color: var(--ink); }
  .fig__cap { padding: 13px 17px 16px; font-family: var(--font-body); font-size: 13.5px; line-height: 1.58; color: var(--ink-2); border-top: 1px solid var(--line); }
  .fig__cap b { color: var(--ink); font-weight: 600; }

  .pp__foot { max-width: 728px; margin: 30px auto 60px; padding-top: 30px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 16px; }
</style>
<script>try{if(localStorage.getItem('abdk-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>

<div class="scroll-progress" id="progress"></div>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<header class="ap-nav">
  <a class="ap-nav__id" href="index.html" data-cursor><b></b>A. AGBOOLA</a>
  <nav class="ap-nav__links">
    <a href="index.html#index" data-cursor>Index</a>
    <a href="papers.html" data-cursor>Papers</a>
    <a href="blog.html" data-cursor>Writing</a>
    <a href="index.html#contact" data-cursor>Contact</a>
  </nav>
  <div class="ap-nav__end">
    <span class="mono">2026</span>
    <button class="theme-toggle" data-theme-toggle data-cursor type="button"><span class="i-moon"><i data-lucide="moon"></i></span><span class="i-sun"><i data-lucide="sun"></i></span></button>
  </div>
</header>

<main class="wrap pp" id="top">
  <aside class="pp__toc" id="paperToc"><div class="pp__toc-h">Contents</div></aside>
  <article class="pp__main">
    <a class="po__back" href="papers.html" data-cursor>← Papers</a>
    <div class="pp__date" id="paperDate"></div>
    <h1 class="pp__title" id="paperTitle">Loading…</h1>
    <p class="pp__lead" id="paperSummary"></p>
    <div class="pp__rule"></div>
    <div class="prose" id="paperBody"></div>
  </article>
</main>
<div class="pp__foot"><span>© 2026 Abdulkabir Agboola</span><a class="po__back" href="papers.html" data-cursor>All papers →</a></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/ap-theme.js"></script>
<script src="js/main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/1.9.1/showdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script src="js/ap-figures.js"></script>
<script src="js/ap-paper.js"></script>
</body>
</html>
