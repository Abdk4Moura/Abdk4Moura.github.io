<style>
  .bl-head { padding: clamp(92px,16vh,168px) 0 26px; }
  .bl-head h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(40px,8vw,86px); line-height: .98; letter-spacing: -.02em; color: var(--ink); margin: 0; }
  .bl-head h1 .dot { color: var(--blue); }
  .bl-head p { font-family: var(--font-body); color: var(--ink-2); max-width: 52ch; margin: 18px 0 0; font-size: clamp(15px,2vw,18px); }
  .bl-head .tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; margin-top: 22px; }
  .bl-list { border-top: 1px solid var(--line); margin-top: 30px; }
  .bl-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 20px; align-items: baseline; padding: 26px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); transition: padding .22s var(--ease), background .22s var(--ease); }
  .bl-row:hover { padding-left: 16px; }
  .bl-row .n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
  .bl-row .ti { font-family: var(--font-display); font-weight: 500; font-size: clamp(18px,2.4vw,25px); letter-spacing: -.01em; }
  .bl-row .su { display: block; font-family: var(--font-body); font-weight: 400; font-size: 14.5px; color: var(--ink-2); margin-top: 7px; max-width: 66ch; line-height: 1.6; }
  .bl-row .dt { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .bl-empty { padding: 40px 4px; color: var(--ink-3); font-family: var(--font-mono); font-size: 12px; }
  .bl-foot { padding: 64px 0 44px; color: var(--ink-3); font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; }
