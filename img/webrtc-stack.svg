<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>WebRTC's DataChannel: a stack, plus ICE choosing the path</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <style>
    .title { font-size:18px; font-weight:700; fill:#1f2430; }
    .msg { font-size:12.5px; font-weight:600; fill:#5b6472; }
    .boxtitle { font-size:16px; font-weight:700; fill:#1f2430; }
    .boxtitle-blue { font-size:16px; font-weight:700; fill:#1f5f9e; }
    .boxsub { font-size:11.5px; fill:#5b6472; }
    .boxsub-blue { font-size:11.5px; fill:#2b5d8a; }
    .icetitle { font-size:16px; font-weight:700; fill:#1f5f9e; }
    .icesub { font-size:11px; font-style:italic; fill:#5b6472; }
    .bullet { font-size:12px; fill:#1f2430; }
    .arrowlabel { font-size:11px; fill:#5b6472; }
  </style>

  <rect x="8" y="8" width="704" height="464" rx="14" fill="#f7f8fa" stroke="#d8dce3" stroke-width="1"/>
  <text x="40" y="38" class="title">WebRTC's DataChannel: a stack, plus ICE choosing the path</text>

  <!-- application message -->
  <text x="210" y="88" text-anchor="middle" class="msg">application message</text>
  <line x1="210" y1="96" x2="210" y2="118" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- SCTP -->
  <rect x="70" y="122" width="280" height="72" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.6"/>
  <text x="210" y="152" text-anchor="middle" class="boxtitle">SCTP</text>
  <text x="210" y="172" text-anchor="middle" class="boxsub">(multi-stream, tunable reliability)</text>
  <line x1="210" y1="194" x2="210" y2="216" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- DTLS -->
  <rect x="70" y="220" width="280" height="62" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.6"/>
  <text x="210" y="248" text-anchor="middle" class="boxtitle">DTLS</text>
  <text x="210" y="266" text-anchor="middle" class="boxsub">(TLS-for-datagrams)</text>
  <line x1="210" y1="282" x2="210" y2="304" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- UDP -->
  <rect x="70" y="308" width="280" height="76" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="210" y="336" text-anchor="middle" class="boxtitle-blue">UDP</text>
  <text x="210" y="356" text-anchor="middle" class="boxsub-blue">(the single path ICE selected</text>
  <text x="210" y="371" text-anchor="middle" class="boxsub-blue">carries all of it)</text>

  <!-- ICE panel -->
  <rect x="400" y="140" width="280" height="216" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="540" y="168" text-anchor="middle" class="icetitle">ICE</text>
  <text x="540" y="186" text-anchor="middle" class="icesub">(connectivity process, NOT a stack layer)</text>
  <line x1="420" y1="198" x2="660" y2="198" stroke="#d8dce3" stroke-width="1"/>
  <text x="420" y="224" class="bullet">&#8226; gather candidates (STUN/TURN)</text>
  <text x="420" y="252" class="bullet">&#8226; probe + validate pairs</text>
  <text x="420" y="280" class="bullet">&#8226; hand the winning UDP path to the</text>
  <text x="432" y="300" class="bullet">stack, then step aside</text>

  <!-- arrow from ICE into the stack -->
  <line x1="470" y1="358" x2="356" y2="344" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="480" y="392" text-anchor="start" class="arrowlabel">hands off the winning UDP path</text>
</svg>
