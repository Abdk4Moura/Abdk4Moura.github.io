<svg viewBox="0 0 720 730" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The packet's real trip, machine to machine</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <style>
    .title { font-size:18px; font-weight:700; fill:#1f2430; }
    .machine { font-size:14px; font-weight:700; fill:#1f2430; }
    .label { font-size:12.5px; fill:#1f2430; }
    .box { fill:#ffffff; stroke:#1f2430; stroke-width:1.6; }
    .box-blue { fill:#eaf2fb; stroke:#2b6cb0; stroke-width:1.8; }
    .wirelabel { font-size:12px; font-weight:700; fill:#2b6cb0; }
  </style>

  <rect x="8" y="8" width="704" height="714" rx="14" fill="#f7f8fa" stroke="#d8dce3" stroke-width="1"/>

  <text x="40" y="38" class="title">The packet's real trip, machine to machine</text>

  <text x="160" y="70" text-anchor="middle" class="machine">Machine A</text>
  <text x="560" y="70" text-anchor="middle" class="machine">Machine B</text>

  <!-- Machine A stack -->
  <rect x="30" y="90" width="260" height="44" rx="8" class="box"/>
  <text x="160" y="117" text-anchor="middle" class="label">app A writes IP packet</text>
  <line x1="160" y1="134" x2="160" y2="160" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="164" width="260" height="54" rx="8" class="box"/>
  <text x="160" y="196" text-anchor="middle" class="label">kernel routes it &#8594; tun0</text>
  <text x="160" y="212" text-anchor="middle" class="label">(fake NIC)</text>
  <line x1="160" y1="218" x2="160" y2="244" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="248" width="260" height="90" rx="8" class="box"/>
  <text x="160" y="273" text-anchor="middle" class="label">VPN program reads inner packet,</text>
  <text x="160" y="291" text-anchor="middle" class="label">encrypts it, wraps as PAYLOAD of an</text>
  <text x="160" y="309" text-anchor="middle" class="label">outer packet addressed to B's real</text>
  <text x="160" y="327" text-anchor="middle" class="label">public IP</text>
  <line x1="160" y1="338" x2="160" y2="360" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="30" y="364" width="260" height="44" rx="8" class="box-blue"/>
  <text x="160" y="391" text-anchor="middle" class="label" fill="#1f5f9e" font-weight="700">real socket &#8594; real NIC</text>

  <!-- Machine B stack -->
  <rect x="430" y="364" width="260" height="44" rx="8" class="box-blue"/>
  <text x="560" y="391" text-anchor="middle" class="label" fill="#1f5f9e" font-weight="700">real NIC receives</text>
  <line x1="560" y1="408" x2="560" y2="434" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="430" y="438" width="260" height="54" rx="8" class="box"/>
  <text x="560" y="470" text-anchor="middle" class="label">kernel hands outer packet</text>
  <text x="560" y="486" text-anchor="middle" class="label">to VPN program</text>
  <line x1="560" y1="492" x2="560" y2="518" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="430" y="522" width="260" height="90" rx="8" class="box"/>
  <text x="560" y="550" text-anchor="middle" class="label">decrypt, unwrap, write</text>
  <text x="560" y="568" text-anchor="middle" class="label">INNER packet into</text>
  <text x="560" y="586" text-anchor="middle" class="label">machine B's tun0</text>
  <line x1="560" y1="612" x2="560" y2="634" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="430" y="638" width="260" height="54" rx="8" class="box"/>
  <text x="560" y="661" text-anchor="middle" class="label">kernel routes inner packet</text>
  <text x="560" y="677" text-anchor="middle" class="label">to app B</text>

  <!-- the wire -->
  <line x1="290" y1="386" x2="426" y2="386" stroke="#2b6cb0" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="358" y="372" text-anchor="middle" class="wirelabel">real wire</text>
  <text x="358" y="404" text-anchor="middle" class="label" font-size="10.5" fill="#5b6472">(outer header only)</text>
</svg>
