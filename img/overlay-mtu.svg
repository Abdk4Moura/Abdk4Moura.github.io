<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Why the overlay MTU must be smaller than the physical MTU</title>
  <defs>
    <marker id="arrowRedUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <style>
    .title { font-size:18px; font-weight:700; fill:#1f2430; }
    .caption { font-size:12.5px; fill:#3a4150; }
    .small { font-size:11px; fill:#5b6472; }
    .small-red { font-size:11.5px; fill:#c0392b; font-weight:700; }
    .bartext { font-size:11.5px; fill:#1f2430; }
    .bartext-blue { font-size:11.5px; fill:#1f5f9e; font-weight:600; }
    .limitlabel { font-size:11px; fill:#c0392b; font-weight:700; }
  </style>

  <rect x="8" y="8" width="704" height="504" rx="14" fill="#f7f8fa" stroke="#d8dce3" stroke-width="1"/>
  <text x="40" y="38" class="title">Why the overlay MTU must be smaller than the physical MTU</text>

  <!-- shared physical-limit guide line -->
  <line x1="660" y1="82" x2="660" y2="468" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="655" y="74" text-anchor="end" class="limitlabel">1500-byte physical frame limit</text>

  <!-- section 1: inner packet -->
  <text x="60" y="96" class="caption">inner packet from the app (fills the app's view of the MTU)</text>
  <rect x="60" y="105" width="600" height="34" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="360" y="127" text-anchor="middle" class="bartext-blue">inner IP packet, 1500 bytes</text>

  <!-- section 2: wrapped, overflow -->
  <text x="60" y="176" class="caption">after the VPN wraps it (encrypt + outer UDP/IP headers)</text>
  <rect x="60" y="185" width="24" height="34" fill="#eef0f3" stroke="#9aa3b2" stroke-width="1.2"/>
  <rect x="84" y="185" width="576" height="34" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.8"/>
  <rect x="660" y="185" width="24" height="34" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <text x="372" y="207" text-anchor="middle" class="bartext">inner packet + crypto</text>
  <text x="72" y="206" class="small" font-size="10" text-anchor="middle">hdr</text>

  <line x1="672" y1="236" x2="672" y2="223" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrowRedUp)"/>
  <text x="480" y="250" text-anchor="middle" class="small-red">too big for a 1500-byte physical frame</text>

  <!-- DF callout -->
  <rect x="60" y="266" width="600" height="60" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
  <rect x="80" y="284" width="30" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,2"/>
  <line x1="83" y1="287" x2="107" y2="301" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="83" y1="301" x2="107" y2="287" stroke="#c0392b" stroke-width="1.6"/>
  <text x="130" y="295" class="small-red" font-size="13">with DF set, this doesn't fragment, it just DISAPPEARS</text>
  <text x="130" y="313" class="small">no error the app can see; the connection just stalls on large transfers</text>

  <!-- section 3: fix -->
  <text x="60" y="352" class="caption">fix: set the TUN MTU low (e.g. 1420) so inner + overhead &#8804; 1500</text>
  <rect x="60" y="361" width="24" height="34" fill="#eef0f3" stroke="#9aa3b2" stroke-width="1.2"/>
  <rect x="84" y="361" width="568" height="34" rx="0" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.8"/>
  <text x="368" y="383" text-anchor="middle" class="bartext-blue">inner packet (&#8804;1420) + crypto</text>
  <text x="368" y="415" text-anchor="middle" class="bartext-blue" font-size="13" font-weight="700">&#8804; 1500 bytes, fits</text>

  <!-- legend -->
  <g transform="translate(60,450)">
    <rect x="0" y="0" width="14" height="14" fill="#eef0f3" stroke="#9aa3b2" stroke-width="1.2"/>
    <text x="20" y="11" class="small">header overhead</text>
    <rect x="150" y="0" width="14" height="14" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.4"/>
    <text x="170" y="11" class="small">fits in one frame</text>
    <rect x="310" y="0" width="14" height="14" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
    <text x="330" y="11" class="small">exceeds the physical MTU</text>
  </g>
</svg>
