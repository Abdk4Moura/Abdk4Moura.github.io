<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The two axes that explain the whole zoo</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
    </marker>
  </defs>
  <style>
    .title { font-size:18px; font-weight:700; fill:#1f2430; }
    .subtitle { font-size:12px; font-style:italic; fill:#5b6472; }
    .axislabel { font-size:12.5px; font-weight:700; fill:#5b6472; letter-spacing:0.5px; }
    .axissub { font-size:10.5px; fill:#8891a0; }
    .rowlabel { font-size:12.5px; font-weight:700; fill:#5b6472; letter-spacing:0.5px; }
    .celltitle { font-size:16px; font-weight:700; fill:#1f2430; }
    .celltitle-blue { font-size:16px; font-weight:700; fill:#1f5f9e; }
    .cellline { font-size:12px; fill:#3a4150; }
    .cellline-blue { font-size:12px; fill:#2b5d8a; }
    .badge { font-size:10.5px; font-weight:700; fill:#ffffff; }
  </style>

  <!-- card background -->
  <rect x="8" y="8" width="704" height="444" rx="14" fill="#f7f8fa" stroke="#d8dce3" stroke-width="1"/>

  <text x="40" y="40" class="title">The two axes that explain the whole zoo</text>
  <text x="40" y="58" class="subtitle">what is carried, versus how much delivery is promised</text>

  <!-- column headers -->
  <text x="273" y="90" text-anchor="middle" class="axislabel">APP &#8596; APP</text>
  <text x="273" y="105" text-anchor="middle" class="axissub">(one app's data)</text>

  <text x="549" y="90" text-anchor="middle" class="axislabel">MACHINE &#8596; MACHINE</text>
  <text x="549" y="105" text-anchor="middle" class="axissub">(a whole machine's packets)</text>

  <!-- row labels (rotated) -->
  <text x="0" y="0" text-anchor="middle" class="rowlabel" transform="translate(70,190) rotate(-90)">BEST-EFFORT</text>
  <text x="0" y="0" text-anchor="middle" class="rowlabel" transform="translate(70,340) rotate(-90)">RELIABLE</text>

  <!-- grid divider lines -->
  <line x1="130" y1="120" x2="130" y2="410" stroke="#d8dce3" stroke-width="1"/>

  <!-- Cell: UDP (top-left) -->
  <rect x="140" y="120" width="266" height="140" rx="8" class="box" fill="#ffffff" stroke="#1f2430" stroke-width="1.6"/>
  <text x="164" y="150" class="celltitle">UDP</text>
  <text x="164" y="174" class="cellline">= the datagram (message)</text>
  <text x="164" y="192" class="cellline">primitive; you build</text>
  <text x="164" y="210" class="cellline">reliability yourself, or don't</text>

  <!-- Cell: WireGuard (top-right) - highlighted, the right box -->
  <rect x="416" y="120" width="266" height="140" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="440" y="150" class="celltitle-blue">WireGuard</text>
  <text x="440" y="174" class="cellline-blue">best-effort by design;</text>
  <text x="440" y="192" class="cellline-blue">the inner protocol owns</text>
  <text x="440" y="210" class="cellline-blue">reliability</text>
  <rect x="440" y="222" width="146" height="20" rx="10" fill="#2b6cb0"/>
  <text x="513" y="236" text-anchor="middle" class="badge">the right box</text>

  <!-- Cell: TCP/QUIC/WebRTC (bottom-left) -->
  <rect x="140" y="270" width="266" height="140" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.6"/>
  <text x="164" y="300" class="celltitle">TCP</text>
  <text x="164" y="324" class="cellline">the reliable stream;</text>
  <text x="164" y="346" class="celltitle" font-size="14">QUIC, WebRTC</text>
  <text x="164" y="368" class="cellline">reliable multi-stream</text>

  <!-- Cell: empty / almost never (bottom-right) - warning -->
  <rect x="416" y="270" width="266" height="140" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="549" y="316" text-anchor="middle" class="celltitle" fill="#a5301f" font-size="14">the box you almost</text>
  <text x="549" y="336" text-anchor="middle" class="celltitle" fill="#a5301f" font-size="14">never want</text>
  <text x="549" y="362" text-anchor="middle" class="cellline" fill="#a5301f">reliable-over-reliable is</text>
  <text x="549" y="380" text-anchor="middle" class="cellline" fill="#a5301f">TCP-over-TCP meltdown</text>
</svg>
