<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>No cross-stream head-of-line blocking in QUIC</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <style>
    .title { font-size:18px; font-weight:700; fill:#1f2430; }
    .caption { font-size:13px; font-weight:700; fill:#1f2430; }
    .streamlabel { font-size:12px; font-weight:700; fill:#5b6472; }
    .sidelabel { font-size:12px; fill:#5b6472; }
    .sidelabel-blue { font-size:12px; fill:#1f5f9e; font-weight:600; }
    .boxnum { font-size:14px; font-weight:700; fill:#1f2430; }
    .boxnum-blue { font-size:14px; font-weight:700; fill:#1f5f9e; }
    .boxnum-red { font-size:14px; font-weight:700; fill:#a5301f; }
    .tag { font-size:9.5px; fill:#5b6472; font-style:italic; }
    .tag-red { font-size:9.5px; fill:#a5301f; font-weight:700; }
    .stall { font-size:12px; fill:#c0392b; font-weight:700; }
  </style>

  <rect x="8" y="8" width="704" height="414" rx="14" fill="#f7f8fa" stroke="#d8dce3" stroke-width="1"/>
  <text x="40" y="38" class="title">No cross-stream head-of-line blocking in QUIC</text>

  <!-- TCP section -->
  <text x="60" y="76" class="caption">TCP: one stream, one loss stalls everything behind it</text>

  <rect x="80" y="90" width="76" height="54" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="118" y="122" text-anchor="middle" class="boxnum-blue">A1</text>

  <line x1="156" y1="117" x2="168" y2="117" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="170" y="90" width="76" height="54" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="208" y="118" text-anchor="middle" class="boxnum-red">A2</text>
  <text x="208" y="134" text-anchor="middle" class="tag-red">LOST</text>

  <line x1="246" y1="117" x2="258" y2="117" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <rect x="260" y="90" width="76" height="54" rx="6" fill="#eef0f3" stroke="#9aa3b2" stroke-width="1.4"/>
  <text x="298" y="118" text-anchor="middle" class="boxnum">A3</text>
  <text x="298" y="134" text-anchor="middle" class="tag">waiting</text>

  <line x1="336" y1="117" x2="348" y2="117" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <rect x="350" y="90" width="76" height="54" rx="6" fill="#eef0f3" stroke="#9aa3b2" stroke-width="1.4"/>
  <text x="388" y="118" text-anchor="middle" class="boxnum">A4</text>
  <text x="388" y="134" text-anchor="middle" class="tag">waiting</text>

  <text x="343" y="168" text-anchor="middle" class="stall">A3 and A4 wait for A2's resend</text>

  <!-- QUIC section -->
  <text x="60" y="222" class="caption">QUIC: independent streams on one connection</text>

  <text x="60" y="282" class="streamlabel">stream A</text>
  <rect x="140" y="254" width="76" height="48" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="178" y="283" text-anchor="middle" class="boxnum-blue">A1</text>
  <line x1="216" y1="278" x2="228" y2="278" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="230" y="254" width="76" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="268" y="278" text-anchor="middle" class="boxnum-red">A2</text>
  <text x="268" y="293" text-anchor="middle" class="tag-red">LOST</text>
  <line x1="306" y1="278" x2="318" y2="278" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <rect x="320" y="254" width="76" height="48" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="358" y="283" text-anchor="middle" class="boxnum-blue">A3</text>
  <line x1="396" y1="278" x2="408" y2="278" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <rect x="410" y="254" width="76" height="48" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="448" y="283" text-anchor="middle" class="boxnum-blue">A4</text>
  <text x="600" y="283" text-anchor="middle" class="sidelabel-blue">A3, A4 keep delivering</text>

  <text x="60" y="362" class="streamlabel">stream B</text>
  <rect x="140" y="334" width="76" height="48" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="178" y="363" text-anchor="middle" class="boxnum-blue">B1</text>
  <line x1="216" y1="358" x2="228" y2="358" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <rect x="230" y="334" width="76" height="48" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="268" y="363" text-anchor="middle" class="boxnum-blue">B2</text>
  <line x1="306" y1="358" x2="318" y2="358" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <rect x="320" y="334" width="76" height="48" rx="6" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="358" y="363" text-anchor="middle" class="boxnum-blue">B3</text>
  <text x="600" y="363" text-anchor="middle" class="sidelabel-blue">unaffected by A's loss</text>
</svg>
