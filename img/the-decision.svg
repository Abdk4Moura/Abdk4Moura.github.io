<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>The decision: filament as the network around a borrowed data plane</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <style>
    .title { font-size:18px; font-weight:700; fill:#1f2430; }
    .cptitle { font-size:16px; font-weight:700; fill:#1f5f9e; }
    .cpsub { font-size:11px; font-style:italic; fill:#5b6472; }
    .cpline { font-size:12px; fill:#3a4150; }
    .connlabel { font-size:11.5px; fill:#5b6472; font-weight:600; }
    .boxtitle { font-size:13.5px; font-weight:700; fill:#1f2430; }
    .boxsub { font-size:11px; fill:#5b6472; }
    .wgtitle { font-size:16px; font-weight:700; fill:#1f5f9e; }
    .wgsub { font-size:11.5px; fill:#2b5d8a; }
    .wgline { font-size:13px; font-weight:600; fill:#1f2430; }
    .wgnote { font-size:10.5px; font-style:italic; fill:#5b6472; }
  </style>

  <rect x="8" y="8" width="744" height="504" rx="14" fill="#f7f8fa" stroke="#d8dce3" stroke-width="1"/>
  <text x="40" y="36" class="title">The decision: filament as the network around a borrowed data plane</text>

  <!-- control plane box -->
  <rect x="80" y="66" width="600" height="92" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.8"/>
  <text x="380" y="92" text-anchor="middle" class="cptitle">filament control plane</text>
  <text x="380" y="108" text-anchor="middle" class="cpsub">(stays filament's job)</text>
  <text x="380" y="128" text-anchor="middle" class="cpline">identity, discovery, NAT traversal/holepunch, relay selection,</text>
  <text x="380" y="144" text-anchor="middle" class="cpline">path selection (direct UDP / TCP shim / WebRTC)</text>

  <!-- connector tree: control plane -> three paths -->
  <line x1="380" y1="158" x2="380" y2="180" stroke="#1f2430" stroke-width="1.6"/>
  <line x1="180" y1="180" x2="580" y2="180" stroke="#1f2430" stroke-width="1.6"/>
  <line x1="180" y1="180" x2="180" y2="204" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="380" y1="180" x2="380" y2="204" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="180" x2="580" y2="204" stroke="#1f2430" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="410" y="174" class="connlabel">selects an underlay path, installs keys</text>

  <!-- three underlay path boxes -->
  <rect x="90" y="208" width="180" height="92" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.6"/>
  <text x="180" y="244" text-anchor="middle" class="boxtitle">direct UDP</text>
  <text x="180" y="262" text-anchor="middle" class="boxsub">(clean case)</text>

  <rect x="290" y="208" width="180" height="92" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.6"/>
  <text x="380" y="236" text-anchor="middle" class="boxtitle">UDP-over-TCP</text>
  <text x="380" y="254" text-anchor="middle" class="boxtitle">or relay</text>
  <text x="380" y="274" text-anchor="middle" class="boxsub">(UDP blocked/policed)</text>

  <rect x="490" y="208" width="180" height="92" rx="8" fill="#ffffff" stroke="#1f2430" stroke-width="1.6"/>
  <text x="580" y="244" text-anchor="middle" class="boxtitle">WebRTC</text>
  <text x="580" y="262" text-anchor="middle" class="boxsub">(browser, or</text>
  <text x="580" y="278" text-anchor="middle" class="boxsub">no-admin fallback)</text>

  <!-- connector tree: three paths -> WireGuard -->
  <line x1="180" y1="300" x2="180" y2="322" stroke="#1f2430" stroke-width="1.6"/>
  <line x1="380" y1="300" x2="380" y2="322" stroke="#1f2430" stroke-width="1.6"/>
  <line x1="580" y1="300" x2="580" y2="322" stroke="#1f2430" stroke-width="1.6"/>
  <line x1="180" y1="322" x2="580" y2="322" stroke="#1f2430" stroke-width="1.6"/>
  <line x1="380" y1="322" x2="380" y2="346" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="400" y="338" text-anchor="start" class="connlabel">WireGuard rides on top of the chosen path</text>

  <!-- WireGuard data plane box -->
  <rect x="80" y="350" width="600" height="112" rx="8" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="380" y="378" text-anchor="middle" class="wgtitle">L3 data plane = WireGuard</text>
  <text x="380" y="396" text-anchor="middle" class="wgsub">(kernel when possible, userspace otherwise)</text>
  <text x="380" y="416" text-anchor="middle" class="wgline">Encrypted IP tunnel. Borrowed, not homegrown.</text>
  <text x="380" y="436" text-anchor="middle" class="wgnote">(the old QUIC-datagram plane survives only as the browser/migration</text>
  <text x="380" y="450" text-anchor="middle" class="wgnote">bridge, since browsers can't run WireGuard at all)</text>
</svg>
